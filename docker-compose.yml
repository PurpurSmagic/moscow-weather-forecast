# Запуск всей системы: docker compose up --build
# Значения ${...} берутся из файла .env (если его нет — используются значения по умолчанию).
name: moscow-weather

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # PostgreSQL читает снимок один раз при создании пустого тома.
      - type: bind
        source: ./data/weather-2026-11-18.sql.gz
        target: /docker-entrypoint-initdb.d/10-weather.sql.gz
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: moscow-weather-app:latest
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      WEATHER_CONFIG: ${WEATHER_CONFIG:-config/settings.yaml}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Настройки можно менять без пересборки образа
      - ./config:/app/config:ro
    command: ["python", "-m", "weather", "run"]

volumes:
  pgdata:
