# Настройки предметной области.
# Секреты и параметры подключения к БД здесь не хранятся — они в .env.

project:
  name: moscow-weather-forecast
  timezone: Europe/Moscow

# Опорная метеостанция — Москва, ВДНХ (индекс ВМО 27612).
# По ней строится фактический ряд и прогноз.
station:
  wmo_id: "27612"
  name: "Москва, ВДНХ"
  latitude: 55.8314
  longitude: 37.6222
  elevation_m: 147

history:
  # С какой даты загружать историю. 1991 год — начало действующего
  # периода климатической нормы ВМО (1991–2020).
  start_date: "1991-01-01"

forecast:
  # Прогнозируемый показатель: среднесуточная температура воздуха, °C
  target: temperature_mean
  # На сколько суток вперёд строится прогноз
  horizon_days: 7

# Пороговые правила, на которые опирается пользователь (служба ЖКХ)
decision_rules:
  heating:
    # П. 5 Правил №354: отопительный период начинается после 5 суток подряд
    # со среднесуточной температурой ниже +8 °C
    threshold_c: 8.0
    consecutive_days: 5
  ice_risk:
    # Переход температуры через 0 °C — риск гололёда
    threshold_c: 0.0
